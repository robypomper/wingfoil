# WingFoil — npm publish pipeline (adr-009, spec-015 §3–§4, dl-018 T3; implemented by task-060).
#
#   gate    → assert the tag is on main and equals v<package.json version> (spec-015 §4), `npm ci`,
#             `prepublishOnly` (build + test + lint), `npm publish --dry-run` (the manifest), pack ONCE
#   stage   → `npm run publish:staging -- --tarball <that tarball>`: ephemeral Verdaccio, publish,
#             clean `npm install -g`, dl-023 init + CLI smoke, teardown — the very script a developer runs
#   promote → publish THAT SAME tarball to npm with provenance (GitHub OIDC)
#
# Trigger: a `vX.Y.Z` tag push. The tag is created on `main` after the release branch merges (dl-024);
# the gate refuses a tag whose commit is not on `main`.
#
# ── Secrets, release authorization and rollback (spec-015 §5, adr-009 §5, adr-006; task-061) ──
#
#   Where the publish credential lives: ONLY in the GitHub Actions secret store, as `NPM_TOKEN`, scoped
#   to the `npm-publish` environment. The promote publish step — and nothing else in this workflow —
#   maps it into its env, writes a transient `.npmrc` in the runner workspace holding the literal line
#   `//registry.npmjs.org/:_authToken=${NPM_TOKEN}` (npm expands the reference when it reads the file,
#   so the token value is never written to disk), publishes, and deletes the file on exit. Promote has
#   no checkout, so there is no git tree to commit that file from; `.npmrc` is also git-ignored.
#   Provenance does not use the token: it is signed through GitHub OIDC (`id-token: write`, promote only).
#   Locally, a developer's own token stays in their `~/.npmrc`, outside the repository.
#
#   Approver runbook — every step below is a human action by the `approver` role (adr-006); agents never
#   hold approval authority and never handle the token:
#   1. One-time setup: Settings → Environments → create `npm-publish`; add the approver as its
#      required reviewer; restrict its deployment tags to `v*`. Until this is done GitHub creates the environment
#      unprotected on the first run, and promote would NOT wait for approval.
#   2. Provide the secret: create a granular npm access token with publish rights, scoped as narrowly as
#      npm allows (ideally `wingfoil` only), with the shortest practical expiry; store it as the environment secret `NPM_TOKEN` of `npm-publish`
#      (not a repository secret, so only a job the approver let through can read it).
#   3. Rotate: before the token expires, or at once if exposure is suspected — create a new token,
#      overwrite the `NPM_TOKEN` environment secret, then revoke the old token on npmjs.com.
#   4. Authorize a release: the tag `vX.Y.Z` is pushed on `main` (spec-015 §4); gate and stage run
#      unattended; promote then waits in `npm-publish` until the approver reviews the run and approves
#      the deployment. Rejecting it ends the run with nothing published.
#   Before the FIRST real publish, bug-023 (engines.node floor) must be fixed — see "Node version" below.
#
#   Rollback posture: a failed stage (staging publish, install or dl-023 smoke) blocks promote — `needs:
#   stage` means promote never runs. For a bad version that did reach npm, do NOT use `npm unpublish`
#   (restricted by npm's unpublish policy, and it removes a version others may already depend on); instead
#        npm deprecate wingfoil@X.Y.Z "broken: <reason> — upgrade to X.Y.Z+1"
#   run by the approver with their own credentials, then ship the fix as a patch release through this
#   same tag flow.
#
# Node version: pinned once in `env.NODE_VERSION` to 22.12.0 — the lowest version every PRODUCTION
# dependency accepts (commander@15 declares `engines.node >=22.12.0`; @hono/node-server@1.19.14,
# transitive via @modelcontextprotocol/sdk, declares >=18.14.1). Since task-074 closed bug-023,
# `package.json` declares that same floor — `engines.node >=22.12.0` — and
# `test/cli/publish-metadata.test.ts` recomputes it from the installed tree, so the two cannot drift
# apart again. Do not add Node 18/20 here: the package no longer claims to run there.
# NOT covered by this pin: some devDependencies want more than 22.12.0 (eslint@10 and @eslint/js@10
# declare `^20.19.0 || ^22.13.0 || >=24`), so `npm ci` in these jobs emits EBADENGINE warnings for
# them. Harmless today — no `engine-strict` — but it means 22.12.0 is the floor of the production
# closure only, not of the dev toolchain.
#
# ── Running this workflow locally with `act` (nektos/act) — no throwaway CI-debug commits (adr-009) ──
#
#   1. Describe a tag push:
#        echo '{"ref": "refs/tags/v0.2.0", "ref_name": "v0.2.0", "ref_type": "tag"}' > /tmp/tag-event.json
#      (use the version currently in package.json, or the gate's tag check fails — which is correct).
#   2. Run the pipeline with a local artifact server so gate → stage → promote can hand the tarball on:
#        act push --eventpath /tmp/tag-event.json --artifact-server-path /tmp/act-artifacts
#      or one job at a time: `act push --eventpath /tmp/tag-event.json --artifact-server-path /tmp/act-artifacts -j gate`
#   3. act sets `ACT=true`: the promote publish step is skipped (`if: !env.ACT`), so a local run can never
#      publish. act has no OIDC issuer, so provenance can only be exercised by a real tag push.
#   The gate's "tag is on main" check needs a local `main` pushed to `origin`; for a dry iteration on a
#   branch, run `npm run prepublishOnly` and `npm run publish:staging` directly instead — they are the
#   same commands the gate and stage jobs run.

name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.12.0'
  TARBALL_ARTIFACT: wingfoil-tarball

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tag commit is on main (dl-024)
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches package.json version (spec-015 §4)
        run: node scripts/check-release-tag.cjs "$GITHUB_REF_NAME"
      - name: Install
        run: npm ci
      - name: prepublishOnly gate — build, test, lint (spec-015 §2)
        run: npm run prepublishOnly
      - name: Publish manifest (dry run)
        run: npm publish --dry-run --ignore-scripts
      - name: Pack the release tarball once
        run: |
          mkdir -p dist-pack
          npm pack --ignore-scripts --pack-destination dist-pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.TARBALL_ARTIFACT }}
          path: dist-pack/*.tgz
          if-no-files-found: error

  stage:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.TARBALL_ARTIFACT }}
          path: dist-pack
      - name: Stage on ephemeral Verdaccio + dl-023 smoke (spec-015 §3 stages 2–3)
        run: npm run publish:staging -- --tarball dist-pack/*.tgz

  promote:
    needs: stage
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.TARBALL_ARTIFACT }}
          path: dist-pack
      - name: Publish the staged tarball to npm with provenance (spec-015 §3 stage 4, §5 transient .npmrc)
        if: ${{ !env.ACT }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +x
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set in the npm-publish environment (see the approver runbook in this file)"
            exit 1
          fi
          trap 'rm -f .npmrc' EXIT
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
          npm publish dist-pack/*.tgz --provenance --access public --userconfig "$PWD/.npmrc"
