# WingFoil — backlog-export (SUB workflow) — DONE
# Specification Downcast Module 4 — operational backlog export. Include-only.
# Source: docs/02_requirements/X_specs-downcast-plan.md §Module 4.
name: backlog-export
kind: sub
description: >-
  Consolidate the documentary chain (USM + BDD + SARD) into a single structured backlog,
  ready to sync into dev tools; partition tasks by release wave.
version: 1.0
role: product-owner
input:
  - docs/02_requirements/      # all generated requirement artifacts
produces:
  - docs/03_backlog/04_backlog/   # backlog.json, schema.json, by-release/*.json

phases:
  - name: generate-records
    description: "One JSON record per MVP user story; Gherkin -> acceptance_criteria; one Technical Task per REQ."
    role: product-owner
  - name: map-dependencies
    description: "Link technical-task IDs into the dependencies[] of affected user stories."
    role: product-owner
  - name: validate
    description: "JSON Schema validation + partition by-release."
    role: product-owner
    checks:
      post: ["valid JSON parse", "no duplicate IDs", "no circular dependencies"]
