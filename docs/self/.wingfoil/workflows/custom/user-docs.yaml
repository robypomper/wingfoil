# WingFoil — user-docs (SUB workflow)
# dl-013 — user-facing documentation gate, between implementation and release-submit. Include-only.
name: user-docs
kind: sub
description: >-
  Ensure the release's user-facing documentation is written and aligned before the release is
  assembled: README, user guide, CLI reference, working examples, CHANGELOG. Makes documentation a
  hard release blocker (dl-013) instead of an unenforced convention.
version: 1.0
element: release

phases:
  - name: check-implementation-complete
    description: "Pre-check: every task tagged for this release is `done` before user docs are finalized."
    role: tech-lead
    checks:
      pre: ["all tasks where tags=[{release.version}] are status: done"]

  - name: align-user-docs
    description: >-
      Write/align the user-facing documentation to the shipped CLI/feature surface for this release.
    role: developer
    produces:
      - "README.md"
      - "docs/user-guide.md"
      - "docs/cli-reference.md"
      - "docs/examples/"
      - "CHANGELOG.md"
    checks:
      post: ["user-facing docs aligned with the release's shipped CLI/feature surface"]
    approval: { by_role: approver }
