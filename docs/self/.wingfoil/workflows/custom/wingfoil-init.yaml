# WingFoil — wingfoil-init (SUB workflow)
# Bridges `specification` -> `seed-first-release-line` -> `release-line-cycle`: initialize the
# WingFoil configuration. Include-only; runs once, right after the specification phase of
# sw-life-cycle. Pure config/tooling bootstrap only — no content/judgment work and no Memory
# seeding at all: the release roadmap moved to release-line-cycle's `initial-design`
# (`seed-releases`, per release-line, since v2+ needs its own roadmap later); ADRs/Decision
# Logs/tech-specs live in `initial-design` too (`seed-adrs`/`seed-dls`/`seed-specs`).
# NOTE: WingFoil's CLI/MCP is not yet usable, so for THIS project this output is produced MANUALLY —
# under docs/self/.wingfoil/. As soon as `wingfoil` is usable, the configuration moves to the
# repository-root .wingfoil/ and the tool performs this step for real (see .wingfoil/README.md).
# Source: Features §P5.1.1 (init); composition is user-defined.
name: wingfoil-init
kind: sub
description: "Initialize the WingFoil configuration: DNA, Memory schema, Directives, Workflows."
version: 1.0

phases:
  - name: init-config
    description: "Create the WingFoil configuration files (dna.yaml, memory.yaml, directives/, workflows.yaml)."
    role: tech-lead
    actions:
      - config.init        # P5.1.1 wizard/params; here performed manually under docs/self/.wingfoil/
    produces:
      - ".wingfoil/dna.yaml"
      - ".wingfoil/memory.yaml"
      - ".wingfoil/memory/templates/"
      - ".wingfoil/roles.yaml"
      - ".wingfoil/directives/"
      - ".wingfoil/workflows.yaml"
      - ".wingfoil/workflows/"
